name: Fork release

# Builds an ad-hoc signed Hammerspoon.app from this fork, bundles the personal
# config and publishes it as the "latest" release, targeting main.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*-rf.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      IS_CI: 1
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.1.0
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install build dependencies
        run: ./scripts/github-ci-pre.sh
      - name: Build Hammerspoon.app (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -workspace Hammerspoon.xcworkspace -scheme Hammerspoon \
            -configuration Release -destination "platform=macOS" \
            -archivePath build/Hammerspoon.xcarchive \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual \
            archive | xcbeautify
          ditto build/Hammerspoon.xcarchive/Products/Applications/Hammerspoon.app build/Hammerspoon.app
          codesign --force --deep --sign - build/Hammerspoon.app
          ditto -c -k --sequesterRsrc --keepParent build/Hammerspoon.app Hammerspoon.app.zip
      - name: Package config
        run: tar -czf config.tar.gz -C config .
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v1.1.1-rf.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "${TAG}" Hammerspoon.app.zip config.tar.gz scripts/fork/install.sh \
            --target main --latest --title "${TAG}" \
            --notes "Hammerspoon fork build with personal config. Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/fork/install.sh | bash\`"

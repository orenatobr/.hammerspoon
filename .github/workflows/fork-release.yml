name: Fork release

# Builds an ad-hoc signed Hammerspoon.app from this fork, bundles the personal
# config and publishes it as the "latest" release, targeting main. The version
# and the release notes come from the top section of CHANGELOG.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    env:
      IS_CI: 1
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.1.0
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install build dependencies
        run: brew install xcbeautify
      - name: Build Hammerspoon.app (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -workspace Hammerspoon.xcworkspace -scheme Hammerspoon \
            -configuration Release -destination "platform=macOS" \
            -archivePath build/Hammerspoon.xcarchive \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual \
            archive | xcbeautify
          ditto build/Hammerspoon.xcarchive/Products/Applications/Hammerspoon.app build/Hammerspoon.app
          codesign --force --deep --sign - build/Hammerspoon.app
          ditto -c -k --sequesterRsrc --keepParent build/Hammerspoon.app Hammerspoon.app.zip
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | grep -v '^Unreleased$' | head -1)"
          [ -n "${VERSION}" ] || { echo "No version found in CHANGELOG.md"; exit 1; }
          TAG="v${VERSION}"
          {
            awk -v v="${VERSION}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/fork/install.sh | bash"
            echo '```'
          } > release-notes.md
          gh release create "${TAG}" Hammerspoon.app.zip \
            --target main --latest --title "${TAG}" --notes-file release-notes.md

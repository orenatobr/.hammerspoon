name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Lua
        uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: '5.3'

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Install dependencies
        run: |
          luarocks install lua_cliargs 3.0.rc-1
          luarocks install luasystem 0.7.1-1
          luarocks install dkjson 2.11-1
          luarocks install say 1.4.1-3
          luarocks install luassert 1.9.0-1
          luarocks install lua-term 0.8-1
          luarocks install penlight 1.15.0-1
          luarocks install luafilesystem 1.9.0-1
          luarocks install mediator_lua 1.1.2-0
          luarocks install busted 2.3.0-1
          luarocks install datafile 0.11-1
          luarocks install luacov 0.17.0-1

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0-1

      - name: Run unit and integration tests
        run: |
          busted --coverage tests/ --pattern='test_.*.lua'

      - name: Run coverage
        run: |
          luacov --pattern='modules/*.lua'
          grep '^modules/.*[0-9]%$' luacov.report.out | awk '{hits+=$2; missed+=$3} END {printf "Total Hits: %d\nTotal Missed: %d\nCoverage: %.2f%%\n", hits, missed, hits/(hits+missed)*100}'

      - name: Check version consistency
        run: scripts/check_version.sh

      - name: Lint Markdown
        run: |
          npx markdownlint-cli '**/*.md'

      - name: Run luacheck lint
        run: luacheck modules
